[build]
  publish = "."

# Same-origin proxies to the Suno API so the browser app works without CORS issues.
# The user's API key is sent per request in the Authorization header and is never stored server-side.
[[redirects]]
  from = "/suno-api/*"
  to = "https://api.sunoapi.org/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/suno-upload/*"
  to = "https://sunoapiorg.redpandaai.co/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
